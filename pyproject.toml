[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seemc-imaging"
version = "0.4.0"
description = "Population-resolved Monte Carlo electron transport for SEM image formation"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Olga Ridzel"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
parallel = ["tqdm>=4.60"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
